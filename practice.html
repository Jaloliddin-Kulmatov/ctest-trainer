 ["Das Haus ___ gerade gebaut.",["wir","wird"],"wird","The house is being built right now.","Passive: wird + Partizip II."]]},
{id:"p4", title:"4. Articles and case", why:"Find the noun's gender, then the case. Type the missing word.", type:"fill", items:[

 ["Hast du heute ___ Zeit?","kein, die Zeit","keine","Don't you have any time today?","die Zeit → keine Zeit"]]}

let P = P1, C = C1, PX = "";
const norm2 = s => (s||"").normalize("NFC").trim().toLowerCase().replace(/\s+/g," ");
async function savePractice(id, data, el){
  el.textContent = "Saving…";
  try{ const db = await getDb(); await db.collection("practice").doc(id).set(Object.assign({at:new Date().toISOString()}, data)); el.textContent = "Saved"; }
  catch(e){ el.textContent = "Could not save"; }
}
function renderPractice(){
let ph = "";
P.forEach(sec=>{
  ph += `<section class="text" id="${sec.id}"><div class="thead"><h2>${esc(sec.title)}</h2><span class="num" id="sc-${sec.id}"></span></div><p style="color:var(--muted);margin:0 0 8px">${esc(sec.why)}</p><div class="redo"><ol>`;
  sec.items.forEach((it,k)=>{
    let q;
    if(sec.type==="choice"){
      q = esc(it[0]).replace("___", `<span class="chosen" id="ch-${sec.id}-${k}">___</span>`) + ` <span class="opts">${it[1].map(o=>`<button class="opt" data-sec="${sec.id}" data-k="${k}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</span>`;
    } else {
      q = esc(it[0]).split("___").map((part,j,arr)=>part+(j<arr.length-1?`<input class="pin" data-sec="${sec.id}" data-k="${k}" style="width:12ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer ${k+1}">`:"")).join("") + ` <span class="src">(${esc(it[1])})</span>`;
    }
    ph += `<li id="li-${sec.id}-${k}">${q}<span class="fix"></span><div class="after" hidden><span class="en">${esc(sec.type==="choice"?it[3]:it[3])}</span><br><span class="why">→ ${esc(sec.type==="choice"?it[4]:it[4])}</span></div></li>`;
  });
  ph += `</ol><div class="qbar"><button class="primary" data-pcheck="${sec.id}">Check answers</button><button data-preset="${sec.id}">Try again</button><span class="saved" id="sv-${sec.id}"></span></div></div></section>`;
});
/* mini C-tests */
const TOK2 = /^([^\p{L}]*)([\p{L}]+(?:-[\p{L}]+)*)?(.*)$/u;
function gapify(mid){
  const out=[]; let want=false, n=0;
  mid.split(/\s+/).forEach(raw=>{
    const m = raw.match(TOK2); const lead=m[1], core=m[2]||"", trail=m[3]||"";
    if(!core || n>=20 || !want || core.length<2 || core.includes("-")){ out.push({plain:raw}); if(core && n<20 && !want) want=true; return; }
    const g = Math.floor(core.length/2); out.push({lead, given:core.slice(0,g), miss:core.slice(g), trail, idx:n++}); want=false;
  });
  return out;
}
C.forEach(c=>{
  c.pieces = gapify(c.mid);
  ph += `<section class="text" id="${c.id}"><div class="thead"><h2>${esc(c.title)} <span class="lvl">${c.lvl}</span></h2><span class="num" id="sc-${c.id}"></span></div><p style="color:var(--muted);margin:0 0 8px">A new text with the same patterns: past tense, plurals, small words, articles. 20 gaps, take 5 minutes.</p>
  <div class="redo"><p class="de" style="margin:0">${esc(c.first)} ${c.pieces.map(p=>p.plain!==undefined?esc(p.plain):`${esc(p.lead)}${esc(p.given)}<input class="cin" data-c="${c.id}" data-i="${p.idx}" maxlength="${p.given.length+1}" style="width:calc(${p.given.length+1}ch + 10px)" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gap ${p.idx+1}">${esc(p.trail)}`).join(" ")} ${esc(c.last)}</p>
  <div class="after" id="tr-${c.id}" hidden><h4 style="margin:12px 0 4px">Translation</h4>${c.en.map(e=>`<div class="en">${esc(e)}</div>`).join("")}<div class="why" id="mist-${c.id}" style="margin-top:8px"></div></div>
  <div class="qbar"><button class="primary" data-ccheck="${c.id}">Check answers</button><button data-creset="${c.id}">Try again</button><span class="saved" id="sv-${c.id}"></span></div></div></section>`;
});
document.getElementById("practice").innerHTML = ph;

/* behaviour */
document.querySelectorAll("#practice input").forEach(inp=>{
  inp.addEventListener("input",()=>{ const v = fixUmlauts(inp.value); if(v!==inp.value) inp.value = v; });
  inp.addEventListener("keydown",e=>{ if(e.key!=="Enter") return; e.preventDefault(); const all=[...inp.closest(".redo").querySelectorAll("input")]; const n=all[all.indexOf(inp)+1]; if(n) n.focus(); else inp.closest(".redo").querySelector(".primary").click(); });
});
const chosen = {};
document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
  const key = b.dataset.sec+"-"+b.dataset.k; chosen[key] = b.dataset.v;
  document.getElementById("ch-"+key).textContent = b.dataset.v;
  b.parentElement.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel", o===b));
}));
document.querySelectorAll("[data-pcheck]").forEach(btn=>btn.addEventListener("click",()=>{
  const sec = P.find(s=>s.id===btn.dataset.pcheck); let ok=0; const wrong=[];
  sec.items.forEach((it,k)=>{
    const li = document.getElementById(`li-${sec.id}-${k}`);
    let ans, good;
    if(sec.type==="choice"){ ans = chosen[sec.id+"-"+k]||""; good = ans===it[2]; li.querySelector(".chosen").classList.toggle("okc",good); li.querySelector(".chosen").classList.toggle("badc",!good); }
    else { const ins=[...li.querySelectorAll("input")]; ans = ins.map(i=>i.value.trim()).join(" "); good = it[2].split("|").some(a=>norm2(a)===norm2(ans)); ins.forEach(i=>{ i.classList.toggle("ok",good); i.classList.toggle("bad",!good); }); }
    li.querySelector(".fix").textContent = good ? "✓" : "→ " + it[2];
    li.querySelector(".after").hidden = false;
    if(good) ok++; else wrong.push({q:it[0], answer:ans, correct:it[2]});
  });
  document.getElementById("sc-"+sec.id).textContent = `${ok}/${sec.items.length}`;
  savePractice(PX+sec.id, {title:sec.title, ok, n:sec.items.length, wrong}, document.getElementById("sv-"+sec.id));
}));
document.querySelectorAll("[data-preset]").forEach(btn=>btn.addEventListener("click",()=>{
  const id = btn.dataset.preset; const root = document.getElementById(id);
  root.querySelectorAll("input").forEach(i=>{ i.value=""; i.classList.remove("ok","bad"); });
  root.querySelectorAll(".fix").forEach(f=>f.textContent=""); root.querySelectorAll(".after").forEach(a=>a.hidden=true);
  root.querySelectorAll(".chosen").forEach(c=>{ c.textContent="___"; c.classList.remove("okc","badc"); });
  root.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  Object.keys(chosen).forEach(k=>{ if(k.startsWith(id+"-")) delete chosen[k]; });
  document.getElementById("sc-"+id).textContent = "";
}));
document.querySelectorAll("[data-ccheck]").forEach(btn=>btn.addEventListener("click",()=>{
  const c = C.find(x=>x.id===btn.dataset.ccheck); let ok=0; const wrong=[];
  const ins = [...document.querySelectorAll(`input[data-c="${c.id}"]`)];
  ins.forEach(inp=>{ const p = c.pieces.find(x=>x.idx===+inp.dataset.i); const good = norm2(inp.value)===norm2(p.miss);
    inp.classList.toggle("ok",good); inp.classList.toggle("bad",!good); if(good) ok++; else wrong.push({word:p.given+p.miss, answer:inp.value.trim()}); });
  document.getElementById("sc-"+c.id).textContent = `${ok}/20`;
  document.getElementById("mist-"+c.id).innerHTML = wrong.length ? "<b>Correct words for your mistakes:</b> " + wrong.map(w=>`<span class="g"><span class="r">${esc(w.word)}</span></span>`).join(" · ") : "<b>All correct!</b>";
  document.getElementById("tr-"+c.id).hidden = false;
  savePractice(PX+c.id, {title:c.title, ok, n:20, wrong}, document.getElementById("sv-"+c.id));
}));
document.querySelectorAll("[data-creset]").forEach(btn=>btn.addEventListener("click",()=>{
  const id = btn.dataset.creset; document.querySelectorAll(`input[data-c="${id}"]`).forEach(i=>{ i.value=""; i.classList.remove("ok","bad"); });
  document.getElementById("tr-"+id).hidden = true; document.getElementById("sc-"+id).textContent = "";
}));
}
function showSet(n){
  P = n==="2" ? P2 : P1; C = n==="2" ? C2 : C1; PX = n==="2" ? "s2-" : "s1-";
  document.querySelectorAll("[data-set]").forEach(b=>{ b.classList.toggle("on", b.dataset.set===n); b.setAttribute("aria-selected", b.dataset.set===n); });
  renderPractice();
}
document.querySelectorAll("[data-set]").forEach(b=>b.addEventListener("click",()=>{ try{ history.replaceState(null,"","#set"+b.dataset.set); }catch(e){} showSet(b.dataset.set); }));
showSet((location.hash||"")==="#set2" ? "2" : "1");
})();
</script>
</body>
