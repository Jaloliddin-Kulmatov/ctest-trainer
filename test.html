 {"id": "e3-1", "set": "E3", "lvl": "A2", "title": "Kochen mit Freunden", "first": "Am Freitagabend haben wir zusammen gekocht.", "mid": "Jeder von uns hat etwas aus seinem Land mitgebracht. Mein Freund aus ~Vietnam hat eine Suppe mit Nudeln gemacht. Meine Freundin aus ~Indien hat Reis mit Gemüse gekocht. Ich habe ~Plov gemacht, das typische Essen aus ~Usbekistan. Danach haben wir alles auf einen großen Tisch gestellt und zusammen gegessen. Alle Gerichte haben sehr gut geschmeckt. Zum Schluss mussten wir viel abwaschen.", "last": "Nächsten Monat wollen wir wieder zusammen kochen."},
 {"id": "e3-2", "set": "E3", "lvl": "A2", "title": "Ein normaler Tag", "first": "Von Montag bis Freitag sieht mein Tag fast immer gleich aus.", "mid": "Ich stehe um sieben Uhr auf und frühstücke schnell. Um acht Uhr fahre ich mit der U-Bahn zur Uni. Am Vormittag habe ich zwei Vorlesungen. Zu Mittag esse ich in der Mensa, weil das Essen dort billig ist. Am Nachmittag lerne ich in der Bibliothek oder treffe meine Lerngruppe. Am Abend koche ich etwas und rufe meine Eltern an. Um elf Uhr gehe ich ins Bett.", "last": "Am Wochenende schlafe ich dann lange."},
 {"id": "e3-3", "set": "E3", "lvl": "A2", "title": "Die vergessene Tasche", "first": "Letzte Woche habe ich meine Tasche im Bus vergessen.", "mid": "In der Tasche waren mein Handy, mein Geldbeutel und mein Schlüssel. Ich habe es erst zu Hause bemerkt. Sofort bin ich zur Haltestelle zurückgelaufen, aber der Bus war natürlich schon weg. Dann habe ich bei der Busfirma angerufen. Eine freundliche Frau hat mir gesagt, dass jemand meine Tasche gefunden hat. Am nächsten Tag konnte ich sie im Büro abholen. Es fehlte nichts.", "last": "Ich hatte wirklich großes Glück."},
 {"id": "e3-4", "set": "E3", "lvl": "A2", "title": "Hobbys in meiner Familie", "first": "Jeder Mensch braucht ein Hobby.", "mid": "Mein Bruder spielt gern Basketball, aber noch lieber spielt er Computerspiele. Meine Schwester malt sehr schön und geht oft ins Museum. Mein Vater angelt am Wochenende am See, weil er dort Ruhe hat. Meine Mutter liest am liebsten Romane. Ich mache gern Sport, besonders Schwimmen und Laufen. Außerdem lerne ich seit einem Jahr Gitarre. Das ist nicht leicht, aber es macht mir viel Spaß.", "last": "Vielleicht spiele ich bald in einer Band."},
 {"id": "e3-5", "set": "E3", "lvl": "A2", "title": "Die Wohnungssuche", "first": "Mein Cousin sucht seit zwei Monaten eine Wohnung.", "mid": "Er möchte eine helle Wohnung mit einem Balkon und einer großen Küche. Sie sollte nicht weit von seiner Arbeit entfernt sein. Leider sind die meisten Wohnungen im Zentrum sehr teuer. Am Stadtrand sind die Mieten billiger, aber dann muss er jeden Tag lange fahren. Letzte Woche hat er eine schöne Wohnung gesehen, aber der Vermieter hat sie einer anderen Familie gegeben. Jetzt sucht er weiter im Internet.", "last": "Ich hoffe, er findet bald etwas."},
 {"id": "e3-6", "set": "E3", "lvl": "A2", "title": "Im Supermarkt", "first": "Einkaufen in Korea war für mich am Anfang nicht einfach.", "mid": "Im Supermarkt konnte ich die meisten Schilder nicht lesen. Ich wusste oft nicht, was in den Packungen war. Einmal habe ich Salz statt Zucker gekauft, weil beide Packungen gleich aussahen. Obst ist hier viel teurer als in meiner Heimat. Dafür sind die Supermärkte sehr lange geöffnet, manche sogar die ganze Nacht. Inzwischen kenne ich die wichtigsten Wörter und finde alles schnell.", "last": "Heute gehe ich sogar gern einkaufen."},
 {"id": "e3-7", "set": "E3", "lvl": "A2+", "title": "Mein erster Job", "first": "Als ich sechzehn war, hatte ich meinen ersten Job.", "mid": "Ich arbeitete in den Sommerferien in einem kleinen Hotel am Meer. Jeden Morgen musste ich um sechs Uhr aufstehen und das Frühstück vorbereiten. Danach putzte ich die Zimmer und wusch die Handtücher. Die Arbeit war hart, und ich durfte nur selten Pause machen. Aber die Gäste waren freundlich und gaben mir oft Trinkgeld. Am Ende des Sommers konnte ich mir von meinem Geld ein neues Fahrrad kaufen.", "last": "Darauf war ich sehr stolz."},
 {"id": "e3-8", "set": "E3", "lvl": "A2+", "title": "Das Internet", "first": "Ohne Internet können sich viele junge Leute ihr Leben nicht mehr vorstellen.", "mid": "Sie benutzen ihr Handy, um Nachrichten zu schreiben, Musik zu hören oder Videos zu sehen. Auch für das Studium ist das Internet sehr wichtig, weil man dort viele Informationen findet. Allerdings sind nicht alle Informationen richtig. Man muss also genau prüfen, wer einen Text geschrieben hat. Viele Eltern sind unzufrieden, weil ihre Kinder zu viel Zeit am Bildschirm verbringen, obwohl sie draußen spielen könnten.", "last": "Wie immer ist das richtige Maß wichtig."},
 {"id": "e4-1", "set": "E4", "lvl": "A2", "title": "Mein Lieblingsplatz", "first": "Mein Lieblingsplatz in der Stadt ist ein kleiner Park.", "mid": "Er liegt hinter dem Bahnhof, zwischen einer Schule und einem Krankenhaus. In der Mitte gibt es einen See mit vielen Enten. Um den See herum stehen alte Bäume und Bänke. Ich setze mich gern auf eine Bank unter einem Baum und lese ein Buch. Manchmal bringe ich auch Brot für die Enten mit. Am Wochenende spielen hier viele Kinder auf der Wiese.", "last": "Dort kann ich mich immer gut entspannen."},
 {"id": "e4-2", "set": "E4", "lvl": "A2", "title": "Ein Geschenk für Papa", "first": "Nächste Woche hat mein Vater Geburtstag.", "mid": "Er wird fünfzig Jahre alt, deshalb wollen wir eine Party für ihn machen. Meine Mutter lädt alle seine Freunde und Kollegen ein. Mein Bruder und ich kaufen ihm zusammen ein Geschenk. Wir möchten ihm eine neue Uhr schenken, weil seine alte kaputt ist. Meine Schwester backt einen Kuchen mit Schokolade, denn das ist sein Lieblingskuchen. Die Party soll eine Überraschung sein.", "last": "Hoffentlich merkt er nichts."},
 {"id": "e4-3", "set": "E4", "lvl": "A2", "title": "Im Hotel", "first": "Letzten Sommer habe ich mit meiner Familie Urlaub in einem Hotel gemacht.", "mid": "Leider gab es am ersten Tag ein Problem. Unser Zimmer war sehr klein, und die Dusche funktionierte nicht. Mein Vater ging zur Rezeption und fragte, ob wir ein anderes Zimmer bekommen könnten. Die Frau an der Rezeption war sehr freundlich. Sie gab uns ein größeres Zimmer mit einem Balkon und einem Blick auf das Meer. Außerdem bekamen wir ein kostenloses Abendessen.", "last": "Danach war der Urlaub perfekt."},
 {"id": "e4-4", "set": "E4", "lvl": "A2", "title": "Mein Deutschkurs", "first": "Seit drei Monaten besuche ich einen Deutschkurs.", "mid": "Der Kurs findet zweimal pro Woche am Abend statt. In meiner Gruppe sind zwölf Leute aus acht Ländern. Unsere Lehrerin kommt aus ~Österreich und spricht sehr deutlich. Wir lernen viel Grammatik, aber wir sprechen auch viel miteinander. Am schwierigsten finde ich die Artikel, weil man sie nicht immer erklären kann. Zu Hause lerne ich jeden Tag neue Wörter mit einer App.", "last": "Im Oktober möchte ich eine Prüfung machen."},
 {"id": "e4-5", "set": "E4", "lvl": "A2", "title": "Viel Schnee", "first": "Letzten Winter gab es in unserer Stadt sehr viel Schnee.", "mid": "In einer Nacht fiel so viel Schnee, dass am Morgen keine Busse fuhren. Viele Schulen blieben geschlossen, und die Kinder freuten sich sehr. Sie bauten im Park einen großen Schneemann und spielten den ganzen Tag draußen. Die Erwachsenen hatten weniger Spaß, weil sie zu Fuß zur Arbeit gehen mussten. Mein Nachbar fiel auf der Straße hin und brach sich den Arm.", "last": "Nach drei Tagen war der Schnee endlich weg."},
 {"id": "e4-6", "set": "E4", "lvl": "A2", "title": "Mein neues Handy", "first": "Vor einem Monat habe ich mir ein neues Handy gekauft.", "mid": "Mein altes Handy war schon fünf Jahre alt und sehr langsam. Das neue Handy hat eine bessere Kamera und einen größeren Bildschirm. Leider war es auch ziemlich teuer. Ich benutze es jeden Tag zum Lernen, für Nachrichten und zum Fotografieren. Manchmal merke ich aber, dass ich zu viel Zeit damit verbringe. Deshalb lege ich es am Abend in ein anderes Zimmer, bevor ich schlafen gehe.", "last": "So schlafe ich viel besser."},
 {"id": "e4-7", "set": "E4", "lvl": "A2+", "title": "Leben auf dem Land", "first": "Meine Großeltern wohnen in einem kleinen Dorf auf dem Land.", "mid": "Dort ist das Leben viel ruhiger als in der Stadt. Jeder kennt jeden, und die Nachbarn helfen sich gegenseitig. Meine Großeltern haben einen großen Garten, in dem sie Obst und Gemüse anbauen. Allerdings gibt es im Dorf keinen Supermarkt und keinen Arzt. Wenn sie einkaufen oder zum Arzt gehen wollen, müssen sie mit dem Bus in die nächste Stadt fahren. Obwohl das manchmal anstrengend ist, möchten sie nicht umziehen.", "last": "Sie sagen, dass sie auf dem Land glücklicher sind."},
 {"id": "e4-8", "set": "E4", "lvl": "A2+", "title": "Studieren im Ausland", "first": "Ein Studium im Ausland ist eine große Chance, aber auch eine Herausforderung.", "mid": "Man lernt eine neue Sprache und eine andere Kultur kennen. Außerdem wird man selbstständiger, weil man viele Probleme allein lösen muss. Am Anfang vermissen viele Studierende ihre Familie und ihre Freunde. Manche fühlen sich einsam, besonders wenn sie die Sprache noch nicht gut sprechen. Deshalb ist es wichtig, schnell neue Kontakte zu finden, zum Beispiel in einem Sprachkurs oder in einem Verein.", "last": "Wer mutig ist, wird diese Zeit nie vergessen."},
 // Mixed-level exams
 {"id": "x1-1", "set": "X1", "lvl": "A2", "title": "Der erste Tag in Korea", "first": "Vor einem Jahr kam ich zum ersten Mal nach Korea.", "mid": "Ich war sehr nervös, weil ich niemanden kannte. Am Flughafen nahm ich einen Bus nach ~Jeonju. Die Fahrt dauerte fast vier Stunden. Im Wohnheim bekam ich ein kleines Zimmer im zweiten Stock. Meine Mitbewohnerin kam aus ~Vietnam und sprach sehr gut Englisch. Sie zeigte mir die Mensa und den Supermarkt. Am Abend gingen wir zusammen essen.", "last": "Da wusste ich, dass ich hier glücklich sein würde."},
 {"id": "x1-2", "set": "X1", "lvl": "A2", "title": "Ein Brief an die Oma", "first": "Liebe Oma, ich schreibe dir aus Korea.", "mid": "Mir geht es gut, aber ich vermisse dich sehr. Jeden Morgen fahre ich mit dem Fahrrad zur Uni. Mein Kurs beginnt um neun Uhr und endet am Nachmittag. Mein Lehrer spricht sehr schnell, deshalb verstehe ich nicht immer alles. Am Wochenende lese ich viel oder treffe meine Freunde. Gestern haben wir zusammen einen Film gesehen. Nächsten Monat besucht mich mein Bruder.", "last": "Ich freue mich schon sehr auf ihn."},
 {"id": "x1-3", "set": "X1", "lvl": "B1", "title": "Ein Unfall im Winter", "first": "Letzten Winter hatte mein Nachbar einen kleinen Unfall.", "mid": "Es war sehr kalt, und auf den Straßen lag viel Schnee. Er fuhr mit dem Auto zur Arbeit, obwohl der Wetterbericht vor Glatteis gewarnt hatte. An einer Kreuzung konnte er nicht mehr rechtzeitig bremsen und fuhr gegen einen Baum. Zum Glück trug er einen Sicherheitsgurt und wurde nur leicht verletzt. Ein Krankenwagen brachte ihn ins Krankenhaus, wo er zwei Tage bleiben musste.", "last": "Seitdem fährt er im Winter lieber mit dem Bus."},
 {"id": "x1-4", "set": "X1", "lvl": "B1", "title": "Online einkaufen", "first": "Immer mehr Menschen kaufen ihre Kleidung im Internet.", "mid": "Das ist bequem, denn man muss nicht in die Stadt fahren und kann zu jeder Zeit bestellen. Außerdem findet man online oft günstigere Preise als im Geschäft. Ein Nachteil ist jedoch, dass man die Sachen vor dem Kauf nicht anprobieren kann. Deshalb schicken viele Kunden einen großen Teil ihrer Bestellungen wieder zurück. Das kostet nicht nur die Firmen viel Geld, sondern schadet auch der Umwelt.", "last": "Manche Händler verlangen deshalb inzwischen eine Gebühr für Rücksendungen."},
 {"id": "x1-5", "set": "X1", "lvl": "B1", "title": "Mein Großvater", "first": "Mein Großvater wurde vor achtzig Jahren in einem kleinen Dorf geboren.", "mid": "Als Kind musste er seinen Eltern jeden Tag auf dem Feld helfen, deshalb konnte er nur wenige Jahre zur Schule gehen. Mit siebzehn verließ er sein Dorf und zog in die Hauptstadt. Dort fand er Arbeit in einer Fabrik und lernte meine Großmutter kennen. Obwohl sie wenig Geld hatten, waren sie sehr glücklich. Später eröffneten sie gemeinsam ein kleines Geschäft, das bald sehr erfolgreich wurde.", "last": "Heute erzählt er seinen Enkeln gern von dieser Zeit."},
 {"id": "x1-6", "set": "X1", "lvl": "B2", "title": "Der Buchdruck", "first": "Um das Jahr 1450 entwickelte Johannes Gutenberg in Mainz ein neues Verfahren zum Drucken von Büchern.", "mid": "Bis dahin wurden Bücher meist von Mönchen per Hand abgeschrieben, was oft mehrere Jahre dauerte. ~Gutenbergs Erfindung ermöglichte es, Texte schnell und in großer Zahl zu vervielfältigen. Dadurch sanken die Preise für Bücher erheblich, und Wissen verbreitete sich in ganz ~Europa. Viele Historiker sind der Meinung, dass ohne den Buchdruck weder die Reformation noch die moderne Wissenschaft möglich gewesen wäre.", "last": "Gutenberg gilt daher bis heute als einer der wichtigsten Erfinder der Geschichte."},
 {"id": "x1-7", "set": "X1", "lvl": "B2", "title": "Vom Land in die Stadt", "first": "Seit Jahrzehnten ziehen immer mehr Menschen vom Land in die Städte.", "mid": "Vor allem junge Leute verlassen ihre Heimatorte, weil sie dort weder Studienplätze noch attraktive Arbeitsstellen finden. In den Dörfern bleiben häufig nur ältere Menschen zurück, sodass Schulen, Geschäfte und Arztpraxen nach und nach schließen. Die Großstädte hingegen kämpfen mit steigenden Mieten und überfüllten Verkehrsmitteln. Inzwischen versuchen einige Gemeinden, mit schnellem Internet und günstigen Grundstücken neue Bewohner anzulocken. Tatsächlich entscheiden sich manche Familien bewusst für ein ruhigeres Leben auf dem Land.", "last": "Ob dieser Trend anhält, bleibt allerdings abzuwarten."},
 {"id": "x1-8", "set": "X1", "lvl": "C1", "title": "Das Gedächtnis", "first": "Unser Gedächtnis funktioniert keineswegs wie eine Videokamera, die Ereignisse originalgetreu aufzeichnet.", "mid": "Vielmehr wird jede Erinnerung beim Abrufen neu konstruiert und dabei unbemerkt verändert. Psychologen konnten in zahlreichen Experimenten nachweisen, dass Menschen sich mit großer Überzeugung an Dinge erinnern, die nie stattgefunden haben. Solche falschen Erinnerungen entstehen beispielsweise durch suggestive Fragen oder durch Erzählungen anderer Personen. Diese Erkenntnisse haben weitreichende Folgen, insbesondere für Gerichtsverfahren, in denen Zeugenaussagen häufig eine entscheidende Rolle spielen.", "last": "Richter sind daher gut beraten, sich nicht ausschließlich auf die Aussagen von Augenzeugen zu verlassen."},
 {"id": "x2-1", "set": "X2", "lvl": "A2", "title": "Mein Morgen", "first": "Mein Tag beginnt sehr früh.", "mid": "Um sechs Uhr klingelt mein Wecker, aber ich stehe meistens erst um halb sieben auf. Zuerst gehe ich ins Bad und dusche. Dann mache ich mir einen Kaffee und esse ein Brot mit Käse. Meine Mitbewohnerin schläft noch, deshalb bin ich ganz leise. Um halb acht verlasse ich das Haus und gehe zur Haltestelle. Der Bus kommt leider oft zu spät.", "last": "Trotzdem bin ich fast immer pünktlich im Unterricht."},
 {"id": "x2-2", "set": "X2", "lvl": "A2", "title": "Im Restaurant", "first": "Am Freitag war ich mit meinen Eltern in einem neuen Restaurant.", "mid": "Wir hatten einen Tisch am Fenster reserviert. Der Kellner war sehr freundlich und brachte uns sofort die Speisekarte. Mein Vater nahm ein Steak mit Kartoffeln, meine Mutter bestellte einen Fisch. Ich aß eine Suppe und danach Nudeln mit Gemüse. Das Essen war sehr lecker, aber leider auch ziemlich teuer. Zum Schluss tranken wir noch einen Tee.", "last": "Wir wollen bald wieder dorthin gehen."},
 {"id": "x2-3", "set": "X2", "lvl": "B1", "title": "Der verlorene Koffer", "first": "Als meine Freundin letzten Sommer nach Spanien flog, passierte etwas Unangenehmes.", "mid": "Nach der Landung wartete sie lange am Gepäckband, aber ihr Koffer kam nicht. Am Schalter der Fluggesellschaft erklärte man ihr, dass der Koffer wahrscheinlich in ein anderes Flugzeug geladen worden war. Sie musste ein Formular ausfüllen und bekam etwas Geld für die wichtigsten Sachen. Also kaufte sie sich eine Zahnbürste, ein T-Shirt und einen Badeanzug. Erst nach drei Tagen brachte ein Fahrer den Koffer endlich ins Hotel.", "last": "Seitdem packt sie immer ein paar Kleidungsstücke ins Handgepäck."},
 {"id": "x2-4", "set": "X2", "lvl": "B1", "title": "Haustiere", "first": "In vielen deutschen Haushalten lebt mindestens ein Haustier.", "mid": "Am beliebtesten sind Katzen, gefolgt von Hunden und kleinen Tieren wie Kaninchen. Besonders für ältere oder allein lebende Menschen ist ein Tier ein wichtiger Begleiter. Wer einen Hund hat, geht mehrmals täglich spazieren und bleibt so in Bewegung. Allerdings sollte man sich vorher gut überlegen, ob man genug Zeit für ein Tier hat. Ein Hund kann nämlich nicht den ganzen Tag allein in der Wohnung bleiben, während sein Besitzer arbeitet.", "last": "Außerdem kosten Futter und Tierarzt jedes Jahr eine Menge Geld."},
 {"id": "x2-5", "set": "X2", "lvl": "B1", "title": "Ein besonderer Lehrer", "first": "An meinen Mathematiklehrer erinnere ich mich noch heute sehr gern.", "mid": "Früher fand ich Mathe furchtbar langweilig und bekam fast immer schlechte Noten. Das änderte sich, als Herr ~Weber an unsere Schule kam. Er erklärte jede Aufgabe so lange, bis alle sie verstanden hatten. Wenn jemand einen Fehler machte, lachte er nie, sondern half ihm geduldig. Oft brachte er auch Spiele mit, die uns zeigten, wie nützlich Mathematik im Alltag ist. Am Ende des Jahres gehörte ich plötzlich zu den Besten der Klasse.", "last": "Ohne ihn hätte ich wohl nie Informatik studiert."},
 {"id": "x2-6", "set": "X2", "lvl": "B2", "title": "Kaffee", "first": "Kaffee gehört zu den beliebtesten Getränken der Welt.", "mid": "Ursprünglich stammt die Pflanze aus ~Äthiopien, von wo aus sie sich über ~Arabien nach ~Europa verbreitete. Im siebzehnten Jahrhundert eröffneten in vielen europäischen Städten die ersten Kaffeehäuser, die sich schnell zu Treffpunkten für Künstler und Intellektuelle entwickelten. Heute trinken die Deutschen im Durchschnitt mehr Kaffee als Wasser oder Bier. Der Anbau findet jedoch fast ausschließlich in tropischen Ländern statt, wo die Bauern oft nur einen geringen Teil des Gewinns erhalten.", "last": "Fair gehandelter Kaffee soll dazu beitragen, ihre Lebensbedingungen zu verbessern."},
 {"id": "x2-7", "set": "X2", "lvl": "B2", "title": "Zu viel Sitzen", "first": "Viele Menschen verbringen den größten Teil ihres Tages im Sitzen.", "mid": "Sie sitzen am Frühstückstisch, im Auto, im Büro und am Abend vor dem Fernseher. Mediziner warnen schon lange davor, dass dieser Bewegungsmangel ernsthafte gesundheitliche Folgen haben kann. Dazu zählen unter anderem Rückenschmerzen, Übergewicht und Herzkrankheiten. Die Weltgesundheitsorganisation empfiehlt Erwachsenen daher, sich mindestens zweieinhalb Stunden pro Woche mäßig intensiv zu bewegen. Schon kleine Veränderungen im Alltag können dabei helfen, etwa wenn man die Treppe statt des Aufzugs nimmt.", "last": "Wer zusätzlich regelmäßig Sport treibt, senkt sein Krankheitsrisiko deutlich."},
 {"id": "x2-8", "set": "X2", "lvl": "C1", "title": "Wissenschaft erklären", "first": "Die Pandemie hat deutlich gemacht, wie wichtig eine verständliche Wissenschaftskommunikation ist.", "mid": "Forschungsergebnisse sind in der Regel vorläufig und werden im Lichte neuer Daten fortlaufend überprüft und gegebenenfalls korrigiert. Für die Öffentlichkeit ist dieser Prozess jedoch nicht immer nachvollziehbar, weshalb wechselnde Empfehlungen leicht als Widersprüche missverstanden werden. Hinzu kommt, dass sich Falschinformationen in sozialen Netzwerken oftmals schneller verbreiten als seriöse Erklärungen. Wissenschaftler stehen deshalb vor der Herausforderung, komplexe Zusammenhänge anschaulich darzustellen, ohne sie unzulässig zu vereinfachen.", "last": "Gelingt dies, kann das Vertrauen in die Forschung nachhaltig gestärkt werden."},
 {"id": "x3-1", "set": "X3", "lvl": "A2", "title": "Ein Wochenende am Meer", "first": "Letzte Woche bin ich mit zwei Freunden nach Busan gefahren.", "mid": "Wir nahmen am Freitagmorgen den Zug und waren schon nach drei Stunden da. Unser Hotel lag direkt am Meer. Am ersten Tag gingen wir an den Strand und schwammen im Wasser. Abends aßen wir frischen Fisch auf dem Markt. Am Samstag besuchten wir einen alten Tempel in den Bergen. Leider regnete es am Sonntag den ganzen Tag.", "last": "Trotzdem war es ein wunderschönes Wochenende."},
 {"id": "x3-2", "set": "X3", "lvl": "A2", "title": "Meine Familie", "first": "Meine Familie ist nicht sehr groß.", "mid": "Mein Vater arbeitet als Ingenieur bei einer großen Firma, und meine Mutter ist Lehrerin an einer Grundschule. Ich habe einen älteren Bruder und eine jüngere Schwester. Mein Bruder wohnt mit seiner Frau in der Hauptstadt und hat schon ein Kind. Meine Schwester geht noch zur Schule. Sie liest sehr gern und möchte später Ärztin werden. Am Wochenende telefoniere ich oft mit meinen Eltern.", "last": "Ich vermisse sie alle sehr."},
 {"id": "x3-3", "set": "X3", "lvl": "B1", "title": "Der neue Job", "first": "Vor zwei Monaten hat mein Freund einen neuen Job angefangen.", "mid": "Er arbeitet jetzt bei einer kleinen Firma, die Apps für Smartphones entwickelt. Am Anfang war alles neu für ihn, und er musste viel lernen. Seine Kollegen halfen ihm aber sehr, deshalb fühlte er sich schnell wohl. Besonders gefällt ihm, dass er manchmal von zu Hause arbeiten darf. Das Gehalt ist zwar nicht so hoch wie in seiner alten Firma, aber dafür hat er weniger Stress. Außerdem kann er sich seine Arbeitszeit selbst einteilen.", "last": "Er ist sehr froh, dass er gewechselt hat."},
 {"id": "x3-4", "set": "X3", "lvl": "B1", "title": "Mülltrennung", "first": "In Deutschland trennt man den Müll in verschiedene Tonnen.", "mid": "Papier kommt in die blaue Tonne, Verpackungen aus Plastik oder Metall gehören in die gelbe Tonne. Für Essensreste gibt es in vielen Städten eine braune Tonne. Glas bringt man zu großen Containern, die meistens an der Straße stehen. Für Ausländer ist dieses System am Anfang oft verwirrend. Wer den Müll falsch trennt, bekommt manchmal Ärger mit den Nachbarn. Das Ziel ist, möglichst viele Materialien zu recyceln und so Rohstoffe zu sparen.", "last": "Darauf sind viele Deutsche sehr stolz."},
 {"id": "x3-5", "set": "X3", "lvl": "B1", "title": "Die erste Prüfung", "first": "Vor meiner ersten großen Prüfung an der Universität war ich sehr aufgeregt.", "mid": "Ich hatte wochenlang gelernt, aber in der Nacht davor konnte ich kaum schlafen. Am Morgen vergaß ich sogar mein Frühstück und kam nur knapp pünktlich an. Als ich die Aufgaben las, wurde ich aber ruhiger, denn die meisten Fragen kannte ich. Ich schrieb drei Stunden lang, ohne eine Pause zu machen. Zwei Wochen später bekam ich das Ergebnis per E-Mail. Ich hatte die Prüfung mit einer guten Note bestanden.", "last": "Danach habe ich mit meinen Freunden gefeiert."},
 {"id": "x3-6", "set": "X3", "lvl": "B2", "title": "Bienen", "first": "Bienen spielen für die Landwirtschaft eine weitaus größere Rolle, als viele Menschen vermuten.", "mid": "Indem sie von Blüte zu Blüte fliegen, bestäuben sie zahlreiche Nutzpflanzen wie Äpfel, Kirschen oder Raps. Ohne ihre Arbeit würden die Erträge vieler Obstsorten drastisch sinken. In den vergangenen Jahren ist die Zahl der Bienen jedoch in vielen Regionen deutlich zurückgegangen. Als Ursachen gelten unter anderem der Einsatz von Pestiziden, der Verlust natürlicher Lebensräume sowie Krankheiten, die von Parasiten übertragen werden.", "last": "Auch Privatleute können helfen, etwa indem sie bienenfreundliche Blumen pflanzen."},
 {"id": "x3-7", "set": "X3", "lvl": "B2", "title": "Studieren im Internet", "first": "Ein Studium ist längst nicht mehr an einen festen Ort gebunden.", "mid": "Immer mehr Hochschulen bieten Studiengänge an, die vollständig online absolviert werden können. Für Berufstätige oder Eltern mit kleinen Kindern ist das eine große Chance, da sie ihre Lernzeiten flexibel gestalten können. Allerdings erfordert ein Fernstudium ein hohes Maß an Selbstdisziplin. Ohne feste Termine und den direkten Kontakt zu Kommilitonen fällt es vielen schwer, motiviert zu bleiben. Studien zeigen, dass die Abbruchquote bei Fernstudiengängen deutlich höher liegt als bei klassischen Präsenzstudiengängen.", "last": "Regelmäßige virtuelle Treffen können hier Abhilfe schaffen."},
 {"id": "x3-8", "set": "X3", "lvl": "C1", "title": "Sprache und Denken", "first": "Ob die Sprache, die wir sprechen, unser Denken beeinflusst, beschäftigt Wissenschaftler seit langem.", "mid": "Lange galt die These, dass Sprecher verschiedener Sprachen die Welt grundlegend unterschiedlich wahrnehmen, als widerlegt. Neuere Untersuchungen deuten allerdings darauf hin, dass sprachliche Strukturen zumindest bestimmte kognitive Prozesse prägen können. So orientieren sich Angehörige mancher Völker, deren Sprachen keine Wörter für links und rechts besitzen, ausschließlich an Himmelsrichtungen. Dadurch verfügen sie über einen erstaunlich präzisen Orientierungssinn, selbst in völlig unbekannter Umgebung.", "last": "Von einer völligen Abhängigkeit des Denkens von der Sprache kann gleichwohl keine Rede sein."},
 {"id": "x4-1", "set": "X4", "lvl": "A2", "title": "Ein Tag im Park", "first": "Gestern war das Wetter endlich wieder schön.", "mid": "Deshalb fuhr ich nach dem Unterricht mit meiner Freundin in den Park. Wir setzten uns auf eine Bank unter einem großen Baum. Sie las ein Buch, und ich hörte Musik. Später kauften wir uns ein Eis und gingen am See spazieren. Dort sahen wir viele Familien mit kleinen Kindern. Um sieben Uhr wurde es kalt, und wir fuhren nach Hause.", "last": "Es war ein sehr schöner Nachmittag."},
 {"id": "x4-2", "set": "X4", "lvl": "A2", "title": "Mein Lieblingsessen", "first": "Mein Lieblingsessen ist Plov, ein traditionelles Gericht aus Usbekistan.", "mid": "Man kocht es mit Reis, Fleisch, Karotten und Zwiebeln in einem großen Topf. Meine Mutter macht den besten ~Plov der Welt. Jeden Freitag kocht sie ihn für die ganze Familie. Als ich klein war, durfte ich ihr manchmal helfen. In ~Korea gibt es leider kein Restaurant, das ~Plov anbietet. Deshalb koche ich ihn jetzt selbst, aber er schmeckt nicht so gut wie zu Hause.", "last": "Ich muss meine Mutter unbedingt nach dem Rezept fragen."},
 {"id": "x4-3", "set": "X4", "lvl": "B1", "title": "Der Umzug", "first": "Im letzten Monat bin ich in eine neue Wohnung umgezogen.", "mid": "Weil ich kein Geld für eine Umzugsfirma hatte, fragte ich meine Freunde, ob sie mir helfen könnten. Am Samstagmorgen kamen fünf Leute und trugen meine Möbel die Treppen hinunter. Leider passte mein großer Schrank nicht in das kleine Auto, deshalb mussten wir einen Transporter mieten. Nach sechs Stunden standen endlich alle Kartons in der neuen Wohnung. Als Dank lud ich alle zum Essen ein.", "last": "Jetzt muss ich nur noch alles auspacken."},
 {"id": "x4-4", "set": "X4", "lvl": "B1", "title": "Das Sprachtandem", "first": "Eine gute Methode, um eine Fremdsprache zu üben, ist ein Sprachtandem.", "mid": "Dabei treffen sich zwei Personen mit unterschiedlichen Muttersprachen, die jeweils die Sprache des anderen lernen möchten. Eine Stunde spricht man zum Beispiel Deutsch, die nächste Stunde Koreanisch. So kann jeder von dem anderen lernen, ohne für Unterricht bezahlen zu müssen. Außerdem lernt man nicht nur Wörter und Grammatik, sondern auch viel über die Kultur des anderen Landes. Viele Universitäten helfen ihren Studierenden dabei, einen passenden Partner zu finden.", "last": "Manchmal entstehen daraus sogar echte Freundschaften."},
 {"id": "x4-5", "set": "X4", "lvl": "B1", "title": "Ein schlechter Tag", "first": "Gestern ging bei mir wirklich alles schief.", "mid": "Zuerst hörte ich meinen Wecker nicht und wachte eine Stunde zu spät auf. Ich zog mich schnell an und lief zur Haltestelle, aber der Bus fuhr gerade weg. Also nahm ich ein Taxi, das mich viel Geld kostete. Im Büro merkte ich dann, dass ich mein Handy zu Hause vergessen hatte. Am Nachmittag fiel auch noch mein Computer aus, und ich verlor einen wichtigen Text. Als ich abends nach Hause kam, war ich völlig erschöpft.", "last": "Zum Glück ist heute ein neuer Tag."},
 {"id": "x4-6", "set": "X4", "lvl": "B2", "title": "Influencer", "first": "In sozialen Netzwerken haben manche Menschen Millionen von Followern.", "mid": "Diese sogenannten Influencer verdienen ihr Geld häufig damit, dass sie Produkte bekannter Marken in ihren Videos präsentieren. Für Unternehmen ist diese Form der Werbung besonders attraktiv, weil sie junge Zielgruppen erreicht, die kaum noch fernsehen. Kritiker bemängeln allerdings, dass die Grenze zwischen persönlicher Meinung und bezahlter Werbung oft nicht klar erkennbar ist. In ~Deutschland müssen Influencer bezahlte Beiträge deshalb inzwischen ausdrücklich als Werbung kennzeichnen.", "last": "Verstöße gegen diese Pflicht können teure Abmahnungen nach sich ziehen."},
 {"id": "x4-7", "set": "X4", "lvl": "B2", "title": "Elektroautos", "first": "Elektroautos gelten als wichtiger Baustein für einen klimafreundlicheren Verkehr.", "mid": "Da sie beim Fahren keine Abgase ausstoßen, verbessern sie vor allem in Städten die Luftqualität. Ihre tatsächliche Klimabilanz hängt jedoch stark davon ab, wie der Strom erzeugt wird, mit dem sie geladen werden. Zudem verbraucht die Herstellung der Batterien große Mengen an Energie und seltenen Rohstoffen. Viele Verbraucher zögern außerdem noch mit dem Kauf, weil die Fahrzeuge vergleichsweise teuer sind und es nicht überall genügend Ladestationen gibt.", "last": "Die Politik versucht, diese Hindernisse mit Förderprogrammen abzubauen."},
 {"id": "x4-8", "set": "X4", "lvl": "C1", "title": "Was glücklich macht", "first": "Was Menschen wirklich glücklich macht, ist eine Frage, die Philosophen seit der Antike beschäftigt.", "mid": "Inzwischen widmet sich auch die empirische Forschung intensiv diesem Thema. Zahlreiche Studien legen nahe, dass materieller Wohlstand nur bis zu einem gewissen Grad zur Zufriedenheit beiträgt. Sind die grundlegenden Bedürfnisse erst einmal gedeckt, gewinnen andere Faktoren zunehmend an Bedeutung, allen voran stabile soziale Beziehungen. Ebenso scheint es sich positiv auszuwirken, wenn Menschen ihre Tätigkeit als sinnvoll empfinden und sich regelmäßig für andere engagieren.", "last": "Glück lässt sich demnach weniger kaufen als vielmehr gemeinsam gestalten."}
];

const DET_RE = /^(d(er|ie|as|en|em|es)|ein(e|en|em|er|es)?|kein(e|en|em|er|es)?|mein(e|en|em|er|es)?|dein(e|en|em|er|es)?|sein(e|en|em|er|es)|ihr(e|en|em|er|es)?|unser(e|en|em|er|es)?|eu(er|re|ren|rem|rer|res)|dies(e|en|em|er|es)|jed(e|en|em|er|es)|welch(e|en|em|er|es)|all(e|en|er|es|em)|viel(e|en|er|es)?|manch(e|en|er)?|beide|beiden|ich|du|er|sie|es|wir|man|sich|mich|mir|dich|dir|ihn|ihm|uns|euch|ihnen|jeder|solcher|solche|solchen)$/;

/* ---------- C-test builder ---------- */
/* other answers that also fit the gap */
const ALT = {gern:["gerne"], gerne:["gern"]};
const TOK = /^([^\p{L}~]*)(~?)([\p{L}]+(?:-[\p{L}]+)*)?(.*)$/u;
function buildGaps(text){
  const tokens = text.mid.split(/\s+/);
  const out = []; let want = false, n = 0, prevEnd = true;
  for(const raw of tokens){
    const m = raw.match(TOK);
    const lead = m[1], lock = m[2] === "~", core = m[3] || "", trail = m[4] || "";
    const isWord = core.length > 0;
    const eligible = isWord && !lock && !core.includes("-") && core.length >= 2;
    let piece;
    if(!isWord){ piece = {plain: raw.replace("~","").replace(/\{[^}]*\}/,"")}; }
    else if(n >= 20){ piece = {plain: lead + core + trail.replace(/^\{[^}]*\}/,"")}; }
    else if(!want){ piece = {plain: lead + core + trail.replace(/^\{[^}]*\}/,"")}; want = true; }
    else if(eligible){
      const g = Math.floor(core.length/2);
      let tr = trail, alts = [];
      const am = tr.match(/^\{([^}]*)\}/);
      if(am){ alts = am[1].split("/"); tr = tr.slice(am[0].length); }
      alts = alts.concat(ALT[core.toLowerCase()] || []);
      const given = core.slice(0,g);
      const okMiss = [core.slice(g)].concat(alts.filter(w=>w.toLowerCase().startsWith(given.toLowerCase()) && w.length-g>=g && w.length-g<=g+1).map(w=>w.slice(g)));
      piece = {lead, given, miss: core.slice(g), okMiss, word: core, trail: tr, idx: n, cat: catOf(core, prevEnd)};
      n++; want = false;
    } else { piece = {plain: lead + core + trail.replace(/^\{[^}]*\}/,"")}; }
    out.push(piece);
    prevEnd = /[.!?]$/.test(raw);
  }
  return {pieces: out, count: n};
}
function catOf(word, sentenceStart){
  const w = word.toLowerCase();
  if(DET_RE.test(w)) return "det";
  if(FN.has(w)) return "fn";
  if(!sentenceStart && /^\p{Lu}/u.test(word)) return "noun";
  return "verb";
}
function fixUmlauts(s){
  return s.replace(/([aouAOU])['"`´:]/g,(m,c)=>({a:"ä",o:"ö",u:"ü",A:"Ä",O:"Ö",U:"Ü"}[c])).replace(/([a-zäöü])B/g,"$1ß").replace(/s'/g,"ß");
}
function norm(s){ return (s||"").normalize("NFC").trim().toLowerCase(); }

/* ---------- test ---------- */
function start(list, title, exam, style){
  S = {id: "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), startedAt: new Date().toISOString(), title, texts: list.map(t=>({t, g: buildGaps(t), answers: [], timeUp:false})), i:0, done:0, timed: exam ? true : store.timer, exam: !!exam, style: style||""};
  showText();
}
function showText(){
  if(S.style==="onset") return showOnset();
  stopTimer();
  const cur = S.texts[S.i];
  const total = S.texts.length;
  const passage = cur.g.pieces.map(p=>{
    if(p.plain!==undefined) return esc(p.plain);
    const w = p.given.length + 1;
    return `<span class="gap">${esc(p.lead)}<span class="given">${esc(p.given)}</span><input id="g${S.i}_${p.idx}" data-idx="${p.idx}" maxlength="${w}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Gap ${p.idx+1}: ${esc(p.given)}…" style="width:calc(${w}ch + 8px)">${esc(p.trail)}</span>`;
  }).join(" ");
  app.innerHTML = `
  <div class="testbar">
    <div class="row" style="gap:12px"><button id="quit">Quit</button><span class="muted">${esc(S.title)} · Text ${S.i+1}/${total}</span></div>
    <div class="dots" aria-hidden="true">${S.texts.map((_,k)=>`<i class="${k<S.i?"on":k===S.i?"cur":""}"></i>`).join("")}</div>
    <span class="timer" id="timer">${S.timed?"5:00":"no timer"}</span>
  </div>
  <article class="sheet">
    <h3>${esc(cur.t.title)} <span class="lvl">${cur.t.lvl}</span></h3>
    <p class="passage">${esc(cur.t.first)} ${passage} ${esc(cur.t.last)}</p>
  </article>
  <div class="row" style="justify-content:space-between">
    <div class="keys" aria-label="Insert special letters">${["ä","ö","ü","ß"].map(k=>`<button data-key="${k}" tabindex="-1">${k}</button>`).join("")}</div>
    <button class="primary" id="next">${S.i<total-1?"Next text →":"Finish and see results"}</button>
  </div>
  <p class="hint">No German keyboard? Type <b>a'</b> <b>o'</b> <b>u'</b> for ä ö ü and <b>s'</b> for ß: they change automatically. Type only the missing letters. Each gap needs as many letters as are shown, or one more. Tab or Enter moves to the next gap.</p>`;
  const inputs = [...app.querySelectorAll(".gap input")];
  inputs.forEach((inp,k)=>{
    inp.addEventListener("focus",()=>lastInput=inp);
    inp.addEventListener("input",()=>{ const v = fixUmlauts(inp.value); if(v!==inp.value){ const pos = Math.max(0, inp.selectionStart - (inp.value.length - v.length)); inp.value = v; try{ inp.setSelectionRange(pos,pos); }catch(e){} } });
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); (inputs[k+1]||document.getElementById("next")).focus(); } });
  });
  app.querySelectorAll("[data-key]").forEach(b=>{
    b.addEventListener("mousedown",e=>e.preventDefault());
    b.onclick=()=>{ const inp=lastInput; if(!inp||inp.disabled) return;
      const s=inp.selectionStart??inp.value.length, e2=inp.selectionEnd??s;
      if(inp.value.length - (e2-s) >= inp.maxLength) return;
      inp.value=inp.value.slice(0,s)+b.dataset.key+inp.value.slice(e2); inp.focus(); inp.setSelectionRange(s+1,s+1); };
  });
  document.getElementById("next").onclick=()=>finishText(false);
  document.getElementById("quit").onclick=()=>{ if(S.quitArmed){ quitTest(); } else { S.quitArmed=true; document.getElementById("quit").textContent="Quit? Click again"; setTimeout(()=>{ if(S){ S.quitArmed=false; const q=document.getElementById("quit"); if(q) q.textContent="Quit"; } },3000); } };
  if(inputs[0]) inputs[0].focus({preventScroll:true});

    const end = Date.now()+300000;

      const left = Math.max(0, end-Date.now());
      const sec = Math.ceil(left/1000);
      el.textContent = Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
      el.classList.toggle("low", sec<=30);
      if(left<=0) finishText(true);
    },250);
  }
}
function finishText(timeUp){
  stopTimer();
  captureCurrent(timeUp);
  S.done = S.i + 1;
  if(S.i < S.texts.length-1){ persist("in progress"); S.i++; showText(); } else results();
}
function captureCurrent(timeUp){
  const cur = S.texts[S.i];
  cur.answers = [...app.querySelectorAll(".gap input")].map(i=>i.value);
  cur.timeUp = !!timeUp;
}
function quitTest(){
  stopTimer();
  captureCurrent(false);
  // keep the half-done text only if something was typed in it
  const typed = S.texts[S.i].answers.some(a=>a.trim());
  S.done = S.i + (typed ? 1 : 0);
  if(S.done > 0) persist("stopped early");
  home();
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

/* ---------- grading ---------- */
function grade(sess){
  let score=0, max=0;
  const cat = {fn:[0,0],det:[0,0],verb:[0,0],noun:[0,0]};
  const per = [], mistakes = [];
  const wordOf = q => q.plain!==undefined ? q.plain : q.lead+q.word+q.trail;
  sess.texts.slice(0, sess.done).forEach(x=>{
    let s=0;
    x.g.pieces.forEach((p,j)=>{
      if(p.idx===undefined) return;
      const a = x.answers[p.idx]||"";
      const ok = (p.okMiss||[p.miss]).some(m=>norm(a)===norm(m));
      p.ok = ok; p.ans = a; p.text = x.t.title;
      p.ctx = x.g.pieces.slice(Math.max(0,j-3), j).map(wordOf).join(" ")+" ["+p.given+"|"+p.miss+"] "+x.g.pieces.slice(j+1,j+3).map(wordOf).join(" ");
      cat[p.cat][1]++; if(ok){ cat[p.cat][0]++; s++; } else mistakes.push(p);
    });
    per.push({id:x.t.id, title:x.t.title, lvl:x.t.lvl, s, n:x.g.count, timeUp:x.timeUp, blank:x.answers.filter(a=>!a.trim()).length});
    score+=s; max+=x.g.count;
  });
  const ranked = Object.entries(cat).filter(([,v])=>v[1]>0).map(([k,v])=>({k, ok:v[0], n:v[1], rate:v[0]/v[1]})).sort((a,b)=>a.rate-b.rate);
  return {score, max, cat, per, mistakes, ranked};
}
function makeRecord(sess, status){
  const r = grade(sess);
  return {
    at: sess.startedAt, updated: new Date().toISOString(), status, title: sess.title, timed: sess.timed,
    score: r.score, max: r.max,
    cats: Object.fromEntries(Object.entries(r.cat).map(([k,v])=>[k,{ok:v[0],n:v[1]}])),
    texts: r.per,
    mistakes: r.mistakes.map(p=>({text:p.text, given:p.given, answer:p.ans, correct:p.miss, word:p.word, cat:p.cat, ctx:p.ctx}))
  };
}
let dbPromise = null;
function getDb(){
  if(!dbPromise) dbPromise = Promise.resolve(window.CTT ? CTT.db : null);
  return dbPromise;
}
async function persist(status){
  const rec = makeRecord(S, status), id = S.id;
  try{
    const db = await getDb();
    if(!db) return false;
    await db.collection("attempts").doc(id).set(rec);
    return true;
  }catch(e){ return false; }
}

  <header class="top"><h1>${esc(S.title)} <small>result</small></h1><button id="home">← Back to start</button></header>
  <section class="score">
    <span class="big">${score}<span class="muted" style="font-size:.5em">/${max}</span></span>
    <span><b>${pct}% correct</b><br>${scaled || `<span class="muted">Full test: 160 points</span>`}</span>
  </section>
  <div class="row"><span class="chip" id="syncState">Saving…</span><button id="copyRes">Copy results</button></div>
  ${weakest ? `<p class="note" style="font-size:15px;color:var(--ink)">Most points lost in <b>${CATS[weakest.k].name}</b> (${weakest.ok}/${weakest.n} correct). Make that your focus: ${({fn:'<a href="vocab.html">small words in the vocabulary trainer</a> and grammar topic 6',det:'<a href="grammar.html#artikel">grammar topics 1 and 2</a> and the der/die/das drill',verb:'<a href="grammar.html#verbliste">the verb list and verb drill</a>',noun:'<a href="grammar.html#nomen">grammar topic 8</a> and the der/die/das drill'})[weakest.k]}. Every wrong gap is now in <a href="mistakes.html">My mistakes</a>.</p>`:""}
  <section>
    <h2>By mistake type</h2>
    <div class="cats">${ranked.map((r,i)=>`<div class="cat ${i===0&&r.rate<.8?"weak":""}"><b>${CATS[r.k].name}</b><span class="num">${r.ok}/${r.n}</span><span class="bar"><i style="width:${r.rate*100}%"></i></span><small>${CATS[r.k].desc}</small></div>`).join("")}</div>
  </section>
  <section>
    <h2>By text</h2>
    <div class="tscores">${per.map(p=>`<div class="ts"><span>${esc(p.title)} <span class="lvl">${p.lvl}</span>${p.timeUp?' <span class="muted" title="Time ran out">⏱</span>':""}</span><span class="num">${p.s}/${p.n}</span></div>`).join("")}</div>
  </section>
  <section>
    <h2>Your mistakes (${mistakes.length})</h2>
    ${mistakes.length ? `<div class="mist">${mistakes.map(p=>`<span class="m">${esc(p.given)}${p.ans?`<s>${esc(p.ans)}</s>`:'<s>___</s>'}→<b>${esc(p.miss)}</b></span>`).join("")}</div>` : `<p>No mistakes. Try a harder text or a full mock test.</p>`}
  </section>
  <section>
    <h2>Read the corrected texts</h2>
    <div style="display:flex;flex-direction:column;gap:8px">${S.texts.map(x=>`<details><summary>${esc(x.t.title)}</summary><p class="solved">${esc(x.t.first)} ${x.g.pieces.map(p=>p.plain!==undefined?esc(p.plain):`${esc(p.lead)}${esc(p.given)}<span class="${p.ok?"r":"w"}">${esc(p.miss)}</span>${esc(p.trail)}`).join(" ")} ${esc(x.t.last)}</p></details>`).join("")}</div>
  </section>`;
  document.getElementById("home").onclick=home;
  const plain = `onSET Trainer – ${S.title}: ${score}/${max}\n` +
    ranked.map(r=>`${CATS[r.k].name}: ${r.ok}/${r.n}`).join("\n") + "\nMistakes:\n" +
    mistakes.map(m=>`${m.given}[${m.ans||"—"}] → ${m.word}   (${m.ctx})`).join("\n");
  document.getElementById("copyRes").onclick = async e => {
    try{ await navigator.clipboard.writeText(plain); e.target.textContent="Copied"; }
    catch(err){ e.target.textContent="Copy failed"; }
  };
  persist("finished").then(ok=>{
    const el = document.getElementById("syncState");
    if(el) el.textContent = ok ? "Saved to your progress · see My mistakes" : "Could not save. Use Copy results";
  });
  window.scrollTo(0,0);
  S = null;
}

window.__ctest = {buildGaps, TEXTS};
/* deep links: test.html#F1 starts that test directly */
const deep = (location.hash||"").replace("#","");
const DEEPSETS = {F1:"Full Simulation 1",F2:"Full Simulation 2",F3:"Full Simulation 3",F4:"Full Simulation 4",O1:"Short Test 1",O2:"Short Test 2",O3:"Short Test 3",O4:"Short Test 4",O5:"Short Test 5",O6:"Short Test 6"};
home();
if(DEEPSETS[deep]) start(TEXTS.filter(t=>t.set===deep), DEEPSETS[deep], true, "onset");
})();
</script>
</body>
</html>
